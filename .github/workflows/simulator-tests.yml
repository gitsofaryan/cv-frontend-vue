name: Simulator Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 7 * * 2'  # Weekly Tuesday 7:30 UTC

jobs:
  unit-tests:
    name: Unit Tests (Web + Desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: |
          npx vitest run --coverage --reporter=junit --outputFile=junit.xml
        env:
          VITE_TEST_ENV: 'ci'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Results
          path: junit.xml

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Coverage
          path: coverage/

  e2e-tests:
    name: E2E Tests (Desktop)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Rust
        if: matrix.os != 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install Tauri CLI and Driver
        run: cargo install tauri-cli tauri-driver --locked

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb

      - name: Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      - name: Start Mock API
        run: |
          npm install -g json-server
          json-server --watch mock-api.json --port 3000 &
          echo "MOCK_API_PID=$!" >> $GITHUB_ENV

      - name: Build Tauri App
        run: npm run tauri build -- --debug

      - name: Install WebDriverIO
        run: npm install --save-dev webdriverio @wdio/cli @wdio/mocha-framework @wdio/local-runner

      - name: Run E2E Tests with WebDriverIO (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npx wdio run ./webdriver/webdriverio/wdio.conf.js
        working-directory: .

      - name: Run E2E Tests (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: npx wdio run ./webdriver/webdriverio/wdio.conf.js
        working-directory: .

      - name: Stop Mock API
        if: always()
        run: kill ${{ env.MOCK_API_PID }} || true

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E Test Results (${{ matrix.os }})
          path: webdriver/webdriverio/test-results/

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Build Tauri App
        run: npm run tauri build -- --ci

      - name: Run Performance Benchmark
        run: |
          npm install benchmark
          node benchmark.js > benchmark-results.txt
        env:
          TAURI_ENV: 'production'

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: Performance Benchmark Results
          path: benchmark-results.txt
