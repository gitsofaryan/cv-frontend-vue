name: Vue + Tauri Simulator Desktop Release

on:
  push:
    branches: ["main"]
  release:
    types: [created]

jobs:
  build-tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Install Tauri CLI and Plugins
        run: |
          npm install -g @tauri-apps/cli
          npm install @tauri-apps/api @tauri-apps/plugin-fs @tauri-apps/plugin-updater --save-dev
        shell: bash

      - name: Setup Rust
        if: matrix.os != 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        shell: bash

      - name: Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config
        shell: bash

      - name: Build Frontend (Vue)
        run: npm run build
        shell: bash

      - name: Build Tauri App
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --ci
        shell: bash

      - name: Upload Tauri Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tauri Build Artifacts (${{ matrix.os }})
          path: src-tauri/target/release/bundle

  create-release:
    runs-on: ubuntu-latest
    needs: build-tauri
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(ubuntu-latest\)/deb/*.deb release-assets/ 2>/dev/null || true
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(ubuntu-latest\)/appimage/*.AppImage release-assets/ 2>/dev/null || true
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(windows-latest\)/msi/*.msi release-assets/ 2>/dev/null || true
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(macos-latest\)/dmg/*.dmg release-assets/ 2>/dev/null || true
          cd artifacts/Tauri\ Build\ Artifacts\ \(macos-latest\)/app 2>/dev/null || true
          for app in *.app; do zip -r "../../../release-assets/${app%.app}.zip" "$app"; done 2>/dev/null || true
          ls -la release-assets/
        shell: bash

      - name: Create GitHub Release with Updater Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          else
            MAJOR=0 MINOR=0 PATCH=0
          fi
          NEW_VERSION="v$MAJOR.$MINOR.$((PATCH + 1))"
          gh release create "$NEW_VERSION" \
            --title "CircuitVerse Desktop $NEW_VERSION" \
            --notes "Official release with in-app updates. Download below." \
            release-assets/* \
            --generate-notes
          echo "{\"version\": \"$NEW_VERSION\", \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"platforms\": {\"linux-x86_64\": {\"signature\": \"\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$NEW_VERSION/app.AppImage\"}, \"windows-x86_64\": {\"signature\": \"\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$NEW_VERSION/app.msi\"}, \"darwin-x86_64\": {\"signature\": \"\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$NEW_VERSION/app.dmg\"}}}" > updater.json
          gh release upload "$NEW_VERSION" updater.json
        shell: bash
