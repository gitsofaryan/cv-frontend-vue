name: Vue + Tauri Simulator Desktop CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [created]
  schedule:
    - cron: '20 6 * * 1'  # Weekly Monday 6:20 UTC

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Upgrade to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'  # Add npm caching

      - name: Install Dependencies
        run: npm ci  # Use `ci` for cleaner installs
        shell: bash

      - name: Install Tauri CLI and Plugins
        run: |
          npm install -g @tauri-apps/cli
          npm install @tauri-apps/api @tauri-apps/plugin-fs @tauri-apps/plugin-updater --save-dev
        shell: bash

      - name: Setup Rust
        if: matrix.os != 'windows-latest'
        uses: dtolnay/rust-toolchain@stable  # Modern Rust setup
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install Platform Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
        shell: bash

      - name: Install Platform Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config
        shell: bash

      - name: Lint with ESLint
        run: |
          npm install eslint@8.10.0 @microsoft/eslint-formatter-sarif@2.1.7
          npx eslint . --ext .js,.jsx,.ts,.tsx --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true
        shell: bash

      - name: Upload ESLint Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif

      - name: Run Unit Tests with Vitest
        run: |
          npx vitest run --coverage --reporter=dot
        env:
          VITE_TEST_ENV: 'ci'
        shell: bash

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: Test Coverage (${{ matrix.os }})
          path: coverage/

      - name: Build Frontend (Vue)
        run: npm run build
        shell: bash

      - name: Build Tauri App
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}  # Add code signing
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --ci  # Add --ci flag for optimized builds
        shell: bash

      - name: Upload Tauri Build Artifacts
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Tauri Build Artifacts (${{ matrix.os }})
          path: src-tauri/target/release/bundle

  create-release:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(ubuntu-latest\)/deb/*.deb release-assets/ 2>/dev/null || true
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(ubuntu-latest\)/appimage/*.AppImage release-assets/ 2>/dev/null || true
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(windows-latest\)/msi/*.msi release-assets/ 2>/dev/null || true
          cp -r artifacts/Tauri\ Build\ Artifacts\ \(macos-latest\)/dmg/*.dmg release-assets/ 2>/dev/null || true
          cd artifacts/Tauri\ Build\ Artifacts\ \(macos-latest\)/app 2>/dev/null || true
          for app in *.app; do zip -r "../../../release-assets/${app%.app}.zip" "$app"; done 2>/dev/null || true
          ls -la release-assets/
        shell: bash

      - name: Create GitHub Release with Updater Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          else
            MAJOR=0 MINOR=0 PATCH=0
          fi
          NEW_VERSION="v$MAJOR.$MINOR.$((PATCH + 1))"
          gh release create "$NEW_VERSION" \
            --title "CircuitVerse Desktop $NEW_VERSION" \
            --notes "Release with updater support. Download below." \
            release-assets/* \
            --generate-notes
          # Generate updater.json for tauri-plugin-updater
          echo "{\"version\": \"$NEW_VERSION\", \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"platforms\": {\"linux-x86_64\": {\"signature\": \"\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$NEW_VERSION/app.AppImage\"}, \"windows-x86_64\": {\"signature\": \"\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$NEW_VERSION/app.msi\"}, \"darwin-x86_64\": {\"signature\": \"\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$NEW_VERSION/app.dmg\"}}}" > updater.json
          gh release upload "$NEW_VERSION" updater.json
        shell: bash
